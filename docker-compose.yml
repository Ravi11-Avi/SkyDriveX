version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: DockerFile
    container_name: skydrivex-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/skydrivex}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - skydrivex-network

  mongodb:
    image: mongo:7.0
    container_name: skydrivex-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - skydrivex-network

networks:
  skydrivex-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
